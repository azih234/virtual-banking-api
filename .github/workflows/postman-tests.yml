name: Postman API Tests

on:
  push:
    branches:
      - main
      - feature/data-driven-testing

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Newman
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman Collection
        run: |
          newman run github-test.postman_collection.json \
          -r cli,json,junit,htmlextra \
          --reporter-json-export reports/results.json \
          --reporter-junit-export reports/results.xml \
          --reporter-htmlextra-export reports/results.html

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-results
          path: reports/